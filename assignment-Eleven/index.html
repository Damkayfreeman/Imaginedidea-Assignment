    <script>
        // Assignment 1 – Display Student Scores with Capitalized Subject

        let student = {
            math: 85,
            science: 90,
            english: 88
        }

        for (let subject in student) {
            let Capitalizedsubject = subject.charAt(0).toUpperCase() + subject.slice(1);
            console.log(`${Capitalizedsubject} score is ${student[subject]}`);
        }


        // Assignment 2 - FizzBuzz Challenge
        let number = 100;
        for (let i = 1; i <= 100; i++) {
            if (i % 3 === 0) {
                console.log("Fizz");

            } else if (i % 5 === 0) {
                console.log("Buzz");

            } else if (i % 3 === 0 && i % 5 === 0) {
                console.log("FizzBuzz");
            } else {
                console.log();
            }
            
        }

        // Assignment 3 – Count Occurrences of Letter 'a'
        let word = "accountant"
        let count = 0;
        for (let char of word) {
            if (char === "a") {
                count++;
            }
        }
        console.log(`The letter 'a' appears ${count} times.`); // letter 'a' appears 2 times


        // Assignment 4 – Display the Current Month Number
        let currentDate = new Date();
        let Months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        console.log(Months[currentDate.getMonth()]); // "August"














    </script>
